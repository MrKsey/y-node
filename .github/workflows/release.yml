name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.6"
  NDK_VERSION: "28.2.13676358"
  BUILD_TOOLS: "36.0.0"
  COMPILE_SDK: "36"
  # SHA-256 of the signing certificate. The APK is only published when the
  # build was signed with the same key as every previous release, so an
  # accidental debug signature or a wrong keystore cannot reach users.
  EXPECTED_CERT_SHA256: "d6e7d94c0ece866a50f40ef19de80dc53ab9f27b1b89df10833f91a3350d89db"

jobs:
  release:
    name: signed APKs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-bridge/go.mod
          cache: true
          cache-dependency-path: go-bridge/go.sum

      - name: Android NDK
        run: |
          # The runner has the SDK and cmdline-tools, but sdkmanager is not on
          # PATH and android-actions/setup-android fails on the removed "tools"
          # package, so the tool is located directly.
          for dir in "$ANDROID_HOME"/cmdline-tools/*/bin; do
            if [ -x "$dir/sdkmanager" ]; then export PATH="$dir:$PATH"; fi
          done
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;android-${COMPILE_SDK}" >/dev/null

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: build the Go bridge (yggnode.aar)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          cd go-bridge
          gomobile init
          mkdir -p ../android/app/libs
          gomobile bind \
            -target=android/arm,android/arm64 \
            -androidapi=26 \
            -ldflags=-checklinkname=0 \
            -o ../android/app/libs/yggnode.aar \
            ./yggnode

      - name: check the tag against pubspec.yaml
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          version="${version%%+*}"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pubspec version ${version}" >&2
            exit 1
          fi

      - name: signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "secret $name is not set" >&2
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/release.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=${GITHUB_WORKSPACE}/android/release.jks
          EOF
          chmod 0600 android/key.properties android/release.jks

      - name: build the signed APKs
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi

      - name: verify the signature
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          version="${version%%+*}"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          for abi in armeabi-v7a arm64-v8a; do
            apk="build/app/outputs/apk/release/Y-Node-${version}-${abi}.apk"
            test -f "$apk"
            "$apksigner" verify --print-certs "$apk" | tee "signature-${abi}.txt"
            # "V2 Signer: certificate SHA-256 digest: <hex>": the digest is the
            # third colon-separated field, not the second.
            actual="$(awk -F': ' '/certificate SHA-256 digest/ {print tolower($3); exit}' "signature-${abi}.txt")"
            if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
              echo "$apk was signed with the wrong key: $actual" >&2
              exit 1
            fi
          done

      - name: checksums
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          version="${version%%+*}"
          mkdir -p dist
          cp "build/app/outputs/apk/release/Y-Node-${version}-armeabi-v7a.apk" dist/
          cp "build/app/outputs/apk/release/Y-Node-${version}-arm64-v8a.apk" dist/
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: release notes
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          version="${version%%+*}"
          # The CHANGELOG section of this version is what users read on the
          # release page: every release must say in a few lines what changed,
          # so a missing section stops the publish instead of shipping an
          # auto-generated commit list.
          awk -v ver="$version" '
            index($0, "## [" ver "]") == 1 { inside = 1; next }
            inside && index($0, "## [") == 1 { exit }
            inside { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          cat release-notes.md

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          version="${version%%+*}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Y-Node ${version}" \
              --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Y-Node ${version}" \
              --notes-file release-notes.md
          fi
