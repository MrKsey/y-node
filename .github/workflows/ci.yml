name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.6"
  NDK_VERSION: "28.2.13676358"
  BUILD_TOOLS: "36.0.0"
  COMPILE_SDK: "36"

jobs:
  test:
    name: flutter test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: test
        run: flutter test

  android:
    name: AAR and APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-go@v5
        with:
          go-version-file: go-bridge/go.mod
          cache: true
          cache-dependency-path: go-bridge/go.sum

      - uses: android-actions/setup-android@v3

      - name: Android NDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;${NDK_VERSION}" "build-tools;${BUILD_TOOLS}" "platforms;android-${COMPILE_SDK}" >/dev/null

      - name: gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20261011034528-197770444867
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: build the Go bridge (yggnode.aar)
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${NDK_VERSION}"
          cd go-bridge
          gomobile init
          mkdir -p ../android/app/libs
          gomobile bind \
            -target=android/arm,android/arm64 \
            -androidapi=26 \
            -ldflags=-checklinkname=0 \
            -o ../android/app/libs/yggnode.aar \
            ./yggnode

      - name: build the APK
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          version="$(awk '/^version:/ {print $2}' pubspec.yaml)"
          version="${version%%+*}"
          cp "build/app/outputs/apk/release/Y-Node-${version}-arm64-v8a.apk" dist/
          cp android/app/libs/yggnode.aar dist/
          cd dist
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: y-node-apk
          path: dist/
          if-no-files-found: error
